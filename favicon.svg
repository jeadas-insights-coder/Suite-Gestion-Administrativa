
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="512"
    height="512"
    viewBox="0 0 512 512"
>

    <defs>

        <!-- DEGRADADO CORPORATIVO -->

        <linearGradient
            id="jdi-gradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="0%"
        >
            <stop offset="0%" stop-color="#214EC2"/>
            <stop offset="50%" stop-color="#19B9DF"/>
            <stop offset="100%" stop-color="#8A3DA6"/>
        </linearGradient>

        <!-- BRILLO DEL LOGOTIPO -->

        <filter
            id="jdi-glow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%"
        >
            <feDropShadow
                dx="0"
                dy="6"
                stdDeviation="10"
                flood-color="#19B9DF"
                flood-opacity=".35"
            />
        </filter>

        <!-- BRILLO DEL DISTINTIVO -->

        <filter id="badge-glow">

            <feGaussianBlur
                stdDeviation="5"
                result="blur"
            />

            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>

        </filter>

    </defs>


    <!-- =====================================
         FONDO DEL ICONO
         ===================================== -->

    <rect
        width="512"
        height="512"
        rx="128"
        fill="#F0EBF5"
    />


    <!-- =====================================
         IDENTIDAD JDI AMPLIADA
         ESCALA 110 %
         ===================================== -->

    <g transform="translate(-25.6 -25.6) scale(1.1)">

        <!-- LETRAS JDI -->

        <g
            fill="url(#jdi-gradient)"
            filter="url(#jdi-glow)"
        >

            <!-- J -->

            <path d="
                M110 150
                H175
                V300
                C175 340 145 365 110 365
                C90 365 70 355 70 335
                H115
                C115 340 120 342 125 342
                C135 342 140 330 140 310
                V205
                H110
                Z
            "/>

            <!-- D -->

            <path
                fill-rule="evenodd"
                d="
                    M205 150
                    H270
                    C315 150 345 180 345 256
                    C345 332 315 362 270 362
                    H205
                    Z

                    M240 195
                    V317
                    H265
                    C285 317 305 300 305 256
                    C305 212 285 195 265 195
                    Z
                "
            />

            <!-- I -->

            <path d="
                M365 150
                H435
                V190
                H420
                V322
                H435
                V362
                H365
                V322
                H380
                V190
                H365
                Z
            "/>

        </g>


        <!-- PUNTO SUPERIOR -->

        <circle
            cx="448"
            cy="105"
            r="13"
            fill="#19B9DF"
        />


        <!-- =================================
             DISTINTIVO DE CARPETA
             ================================= -->

        <g>

            <circle
                cx="414"
                cy="414"
                r="61"
                fill="#19B9DF"
                filter="url(#badge-glow)"
            />

            <circle
                cx="414"
                cy="414"
                r="61"
                fill="none"
                stroke="#FFFFFF"
                stroke-opacity=".9"
                stroke-width="5"
            />


            <!-- CARPETA -->

            <g fill="#FFFFFF">

                <path d="
                    M378 392
                    Q378 384 386 384
                    H405
                    L414 394
                    H443
                    Q451 394 451 402
                    V436
                    Q451 444 443 444
                    H386
                    Q378 444 378 436
                    Z
                "/>

                <path d="
                    M378 402
                    H451
                    L444 435
                    Q443 440 437 440
                    H384
                    Q379 440 378 434
                    Z
                "/>

            </g>

            <!-- ANIMACIÓN DEL DISTINTIVO -->

            <animateTransform
                attributeName="transform"
                type="scale"
                values="1;1.035;1"
                dur="2.8s"
                repeatCount="indefinite"
                additive="sum"
            />

        </g>

    </g>

</svg>
