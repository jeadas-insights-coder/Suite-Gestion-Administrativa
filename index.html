<div id="bar"></div>
<div id="root"></div>

<!-- ========================================================== -->
<!-- CONTROL DE RETRASO CRÍTICO -->
<!-- ========================================================== -->
<script>
  window.JDI_V = '2.0.0';

  // Creamos una función que inyectará tus scripts locales de forma dinámica
  function cargarAplicacionLocal() {
    const scripts = ['config.js?v=2.0.0', 'assets/jdi-theme.js?v=2.0.0', 'js/shell.js?v=2.0.0'];
    
    scripts.forEach(src => {
        const el = document.createElement('script');
        el.src = src;
        el.async = false; // Mantiene el orden estricto de carga de tu suite
        document.body.appendChild(el);
    });
  }

  // ⏱️ EL TRUCO: Le damos 2.3 segundos de exclusividad absoluta a la animación del Splash.
  // Mientras tanto, la lógica del Login queda congelada y no puede pisar la vista.
  setTimeout(cargarAplicacionLocal, 2300);
</script>

</body>
