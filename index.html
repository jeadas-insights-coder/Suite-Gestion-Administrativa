<body style="margin:0;padding:0;">

<!-- =====================================================
     SPLASH SCREEN
     ===================================================== -->

<div id="splash-screen">

    <!-- LUZ SUPERIOR -->

    <div style="
        position:absolute;
        width:clamp(180px,35vw,350px);
        height:clamp(180px,35vw,350px);
        background:#19B9DF;
        filter:blur(clamp(70px,12vw,140px));
        opacity:.12;
        top:15%;
        left:15%;
        animation:splashFloatGlow 6s ease-in-out infinite alternate;
        pointer-events:none;
    "></div>

    <!-- LUZ INFERIOR -->

    <div style="
        position:absolute;
        width:clamp(200px,40vw,400px);
        height:clamp(200px,40vw,400px);
        background:#8A3DA6;
        filter:blur(clamp(80px,14vw,160px));
        opacity:.10;
        bottom:15%;
        right:15%;
        animation:splashFloatGlow 8s ease-in-out infinite alternate-reverse;
        pointer-events:none;
    "></div>

    <!-- TARJETA CENTRAL -->

    <div id="splash-card">

        <!-- BRILLO -->

        <div style="
            position:absolute;
            top:-50%;
            left:-150%;
            width:60%;
            height:200%;
            background:linear-gradient(
                90deg,
                transparent,
                rgba(25,185,223,.2),
                rgba(138,61,166,.15),
                transparent
            );
            transform:rotate(30deg);
            animation:splashShineHover 2.5s ease-in-out infinite;
        "></div>

        <!-- IDENTIDAD -->

        <div style="
            margin-bottom:5px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        ">
          
          <!-- CONTENEDOR DEL LOGOTIPO -->
          
          <div class="jdi-splash-logo-container">
          
              <img
                  class="jdi-splash-logo"
                  src="./favicon.svg?v=2.0.4"
                  alt="JeaDas.Insights"
              >
          
          </div>
             <h1
                id="splash-titulo"
                style="
                    color:#fff;
                    font-size:3.2rem;
                    font-weight:900;
                    letter-spacing:3px;
                    margin:0;
                    padding:0;
                "
            >
                JeaDas<span style="
                    color:#19B9DF;
                    text-shadow:0 0 25px rgba(25,185,223,.5);
                ">.Insights</span>
            </h1>

            <p
                id="splash-mensaje"
                style="
                    color:rgba(255,255,255,.7);
                    font-size:1.1rem;
                    margin:15px 0 0;
                    font-weight:400;
                    letter-spacing:.5px;
                "
            >
                Gracias por visitarnos
            </p>

        </div>

        <!-- BARRA DE PROGRESO -->

        <div id="splash-progress-bar">

            <div style="
                position:absolute;
                width:100%;
                height:100%;
                background:linear-gradient(
                    90deg,
                    #214EC2,
                    #19B9DF,
                    #8A3DA6
                );
                animation:splashLineLoad 2s
                cubic-bezier(.4,0,.2,1) forwards;
            "></div>

        </div>

    </div>

</div>

<!-- =====================================================
     CONTENEDORES DEL ECOSISTEMA
     ===================================================== -->

<div id="bar"></div>

<div id="root"></div>

<div
    id="toasts"
    role="status"
    aria-live="polite"
></div>

<!-- CONTROL DE VERSIÓN Y DESPEDIDA -->

<script>

window.JDI_V = '2.0.4';

window.mostrarDespedida = function(
    urlRedireccion = 'index.html'
) {

    const screen =
        document.getElementById('splash-screen');

    const titulo =
        document.getElementById('splash-titulo');

    const mensaje =
        document.getElementById('splash-mensaje');

    const bar =
        document.getElementById('splash-progress-bar');

    if (!screen) return;

    if (titulo) {
        titulo.innerHTML = '¡Hasta pronto!';
    }

    if (mensaje) {
        mensaje.innerText =
            'Que tengas una hermosa jornada';

        mensaje.style.color = '#19B9DF';
    }

    if (bar) {

        bar.style.width = 'min(150px, 100%)';
        bar.style.margin = '30px auto 0';

        bar.innerHTML = `
            <div style="
                position:absolute;
                width:100%;
                height:100%;
                background:linear-gradient(
                    90deg,
                    #8A3DA6,
                    #19B9DF
                );
                animation:splashLineLoad 1.8s linear forwards;
            "></div>
        `;
    }

    screen.classList.add('forzar-despedida');

    setTimeout(function() {

        window.location.href = urlRedireccion;

    }, 2200);

};

</script>


<!-- REGISTRO PWA JEADAS.INSIGHTS -->

<script>

if ('serviceWorker' in navigator) {

    window.addEventListener('load', function() {

        navigator.serviceWorker
            .register('./sw.js', {
                scope: './'
            })

            .then(function(registration) {

                console.log(
                    'JeaDas.Insights PWA registrada:',
                    registration.scope
                );

            })

            .catch(function(error) {

                console.error(
                    'Error registrando PWA:',
                    error
                );

            });

    });

}

</script>

</script>
