<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JeaDas.Insights - Cites&amp;Firmas</title>
<style>
:root{color-scheme:dark;--acc:var(--jdi-primary,#3b82f6);--jdi-primary:#214EC2;--jdi-on-primary:#FFFFFF;--jdi-primary-hover:#1E46AF;--jdi-primary-focus:rgba(55,96,200,.45);--bg:#13235A;--bg2:#1A2D6E;--card:#1D3278;--bd:#2E4796;--tx:#F4F7FF;--mu:#B4C0E6;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Inter,system-ui,Arial,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,color-mix(in srgb,var(--acc) 18%,transparent),transparent),var(--bg);color:var(--tx);min-height:100vh}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 22px;background:rgba(19,35,90,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{height:34px;max-width:120px;object-fit:contain;border-radius:6px}.brand{font-weight:700;letter-spacing:.3px;font-size:18px}
nav{display:flex;gap:4px;margin-left:18px;overflow-x:auto}nav button,.tabs button{background:none;border:0;color:var(--mu);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;transition:.25s var(--ease);width:auto;margin:0}
nav button:hover,.tabs button:hover{color:var(--tx);background:#ffffff10}nav button.on,.tabs button.on{color:var(--jdi-on-primary,#fff);background:var(--acc)}
#quien{margin-left:auto;color:var(--mu);font-size:13px;white-space:nowrap}
main{max-width:1180px;margin:auto;padding:24px 18px 60px}
.hero{padding:34px;border-radius:18px;margin-bottom:22px;background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 38%,#1A2D6E),#1A2D6E 75%);border:1px solid var(--bd);animation:in .6s var(--ease)}
.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;color:var(--mu)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;position:relative;overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s;animation:in .5s var(--ease) both}
.card.hv{cursor:pointer}.card.hv:hover{transform:translateY(-6px) scale(1.025);border-color:var(--acc);box-shadow:0 18px 40px #000a,0 0 0 1px var(--acc)}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--s,var(--bd))}
.VERDE{--s:#2ecc71}.AMARILLO{--s:#f1c40f}.ROJO{--s:#e74c3c}
.stat{font-size:34px;font-weight:700}.mu{color:var(--mu);font-size:13px}.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:#ffffff14;font-size:12px;margin:6px 6px 0 0}
.p{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:18px;animation:in .5s var(--ease)}
label{display:block;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin:2px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;margin:0 0 12px;background:#0F1D4E;color:var(--tx);border:1px solid var(--bd);border-radius:10px;font-size:15px;transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
input[type=checkbox]{width:auto;margin:0;accent-color:var(--acc)}
.btn{background:var(--acc);color:var(--jdi-on-primary,#fff);border:0;border-radius:10px;padding:11px 20px;font-size:15px;cursor:pointer;transition:.25s var(--ease);width:auto;margin:4px 6px 4px 0}
.btn:hover{filter:brightness(1.15);transform:translateY(-2px)}.btn.s{background:#2a3040}.btn.sm{padding:6px 12px;font-size:13px}
.g{display:grid;gap:0 14px;grid-template-columns:1fr 1fr}@media(max-width:640px){.g{grid-template-columns:1fr}header{flex-wrap:wrap}nav{margin:0;order:3;width:100%}}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:center}th:first-child,td:first-child{text-align:left}
#msg{position:fixed;right:18px;bottom:18px;z-index:50;max-width:380px;padding:14px 18px;border-radius:12px;display:none;box-shadow:0 10px 30px #000a;animation:in .3s var(--ease)}
.ok{background:#14532d}.er{background:#7f1d1d}.h{display:none!important}
#login{max-width:400px;margin:9vh auto;text-align:center}#login .logo{height:64px;max-width:200px;margin-bottom:10px}
a{color:var(--acc)}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* tokens: hover 10 % más oscuro y anillo de enfoque derivados del acento */
.btn:not(.s):hover{background:var(--jdi-primary-hover,var(--acc));filter:none}
.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--jdi-primary-focus,rgba(55,96,200,.45));outline-offset:2px}
/* celular: sin hover, el feedback es el toque (:active) */
.btn:not(.s):active{background:var(--jdi-primary-hover,var(--acc));transform:scale(.98)}nav button:active,.tabs button:active{background:#ffffff1c}
</style></head><body>
<header><span class="brand" id="hn">Cites&amp;Firmas</span><nav id="nav"></nav><span id="quien"></span></header>
<main>
<div id="msg"></div>

<div id="app">
<section id="v-inicio"></section>

<section id="v-registros" class="h"><div class="p"><div class="g"><div><label>Cite / ID / Asunto</label><input id="bq" onkeydown="if(event.key==='Enter')buscar()"></div>
<div><label>Estado</label><select id="be"></select></div></div><button class="btn" onclick="buscar()">Buscar</button></div>
<div id="lista" class="grid"></div><div id="det" class="p h" style="margin-top:18px"></div></section>

<section id="v-nuevo" class="h"><div class="p"><h3>Solicitar cite</h3><div class="g">
<div><label>Tipo documental</label><select id="at"></select></div><div><label>Dependencia</label><select id="ad" onchange="unidades()"></select></div>
<div><label>Unidad</label><select id="au" onchange="unidades(1)"></select></div><div><label>Jefatura (opcional)</label><select id="aj"></select></div>
<div class="mu" id="fh" style="align-self:center"></div>
<div id="dd"><label>Destino</label><select id="ade"></select></div><div><label>Responsable</label><input id="ar"></div></div>
<label>Destinatario</label><input id="adt"><label>Asunto</label><input id="aa"><label>Referencia</label><input id="arf">
<button class="btn" onclick="alta()">Solicitar cite</button><div id="vc" class="card" style="display:none;margin-top:12px"></div></div></section>

<section id="v-recibidos" class="h"><div class="p" id="rform"></div>
<div class="p"><div class="g"><div><label>Buscar (remitente, número o asunto)</label><input id="rq" onkeydown="if(event.key==='Enter')buscarRec()"></div><div><label>Estado</label><select id="re"><option value="">Todos</option><option>Recibido</option><option>Derivado</option><option>Respondido</option><option>Atendido</option></select></div></div><button class="btn" onclick="buscarRec()">Buscar</button></div>
<div id="rlista" class="grid"></div><div id="rdet" class="p h" style="margin-top:18px"></div></section>

<section id="v-derivaciones" class="h"><div class="p"><div class="g"><div><label>Estado</label><select id="de"><option value="">Todos</option><option>Pendiente</option><option>Recibida</option><option>Respondida</option><option>Cerrada</option><option>Anulada</option></select></div>
<div><label>Origen</label><select id="ds"><option value="">Emitidos y recibidos</option><option>Emitido</option><option>Recibido</option></select></div>
<div style="align-self:end"><label style="display:flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" id="dab" checked> Solo abiertas</label></div></div><button class="btn" onclick="listarDer()">Filtrar</button></div>
<div id="dlista"></div></section>

<section id="v-admin" class="h"><div class="tabs" id="atabs"></div><div id="adm"></div></section>
</div>
</main>
<script src="../../assets/suite-bridge.js?v=2.0.0"></script>
<script>
const ETQ = { alta: "Registrar", estado: "Cambiar estado", pdf: "Cargar PDF", historial: "Ver historial", usuarios: "Usuarios", admin: "Administración", anular: "Anular cites", editar: "Editar datos del documento", consultar: "Consultar y buscar documentos", recibir: "Registrar correspondencia recibida", derivar: "Derivar y dar seguimiento" };
let cat = null, ad = null, vista = "inicio";
const $ = id => document.getElementById(id), has = p => cat && cat.permisos.includes(p);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ss = { get: k => { try { return sessionStorage.getItem("jdi.firmas." + k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem("jdi.firmas." + k, v); } catch (e) {} } };
let mt; function msg(t, ok) { const m = $("msg"); clearTimeout(mt); m.textContent = t; m.className = ok ? "ok" : "er"; m.style.display = t ? "block" : "none"; mt = setTimeout(() => m.style.display = "none", 6000); }
async function api(p) { const j = await JDI.api(p); if (!j || !j.ok) throw new Error((j && (j.mensaje || j.error)) || "Error"); return j; }
const run = f => async (...a) => { try { return await f(...a); } catch (e) { msg(e.message); } };
function marca(m) { $("hn").textContent = "Cites&Firmas · " + (m && m.nombre || JDI.empresa.nombre || ""); }
const salir = () => JDI.irAInicio();
const opts = (a, v, t) => a.map(x => `<option value="${esc(v ? x[v] : x)}">${esc(t ? t(x) : x)}</option>`).join("");
async function iniciar() {
  try { cat = await api({ op: "catalogos" }); } catch (e) { if (/cambiar su usuario/.test(e.message)) mostrarPrimer(); else msg(e.message); return; }
  marca(cat.marca);
  $("quien").textContent = cat.usuario.nombre + " · " + cat.usuario.rol;
  const m = cat.modulos, tabs = [["inicio", "Inicio"], m.busqueda && has("consultar") && ["registros", "Registros"], m.alta && has("alta") && ["nuevo", "Nuevo"], has("consultar") && ["recibidos", "Recibidos"], has("consultar") && ["derivaciones", "Derivaciones"], has("admin") && ["admin", "Administración"], ["salir", "Inicio Suite"]].filter(Boolean);
  $("nav").innerHTML = tabs.map(t => `<button data-v="${t[0]}" onclick="ir('${t[0]}')">${t[1]}</button>`).join("");
  $("be").innerHTML = '<option value="">Todos</option>' + opts(cat.estados); $("at").innerHTML = opts(cat.tipos, "Codigo", x => x.Codigo + " — " + x.Tipo);
  $("ad").innerHTML = opts(cat.dependencias, "Sigla", x => x.Sigla); $("ade").innerHTML = opts(cat.destinos); unidades(); dest();
  ir("inicio"); }
function ir(v) { if (v === "salir") return salir(); vista = v;
  ["inicio", "registros", "nuevo", "recibidos", "derivaciones", "admin"].forEach(s => $("v-" + s).classList.toggle("h", s !== v));
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if ((v === "inicio" || v === "registros") && has("consultar")) buscar(); else if (v === "inicio") $("v-inicio").innerHTML = `<div class="hero"><h1>Bienvenido, ${esc(cat.usuario.nombre)}</h1><p>${esc(cat.marca.nombre)}</p></div>`; if (v === "recibidos") { formRec(); buscarRec(); } if (v === "derivaciones") listarDer(); if (v === "admin") adminTab(ss.get("at") || "modulos"); }
function unidades(soloJ) { if (!soloJ) $("au").innerHTML = opts(cat.unidades.filter(u => u.Dependencia === $("ad").value), "Sigla", x => x.Sigla);
  $("aj").innerHTML = '<option value="">(ninguna)</option>' + opts(cat.jefaturas.filter(j => j.Dependencia === $("ad").value && j.Unidad === $("au").value), "Sigla", x => x.Sigla); }
function dest() { const t = cat.tipos.find(x => x.Codigo === $("at").value) || {}, ps = cat.flujos.filter(f => f.Tipo === t.Codigo).sort((x, y) => x.Orden - y.Orden);
  $("dd").classList.toggle("h", t.Flujo === "NO" || ps.length > 0);
  $("fh").textContent = t.Flujo === "NO" ? "Este tipo no pasa por flujo de firma: solo cite y archivo." : ps.length ? "Flujo: " + ps.map(f => f.Etapa + " " + f.Instancia).join(" → ") : "Flujo: elija el destino."; }
$("at").addEventListener("change", dest);
const tarjeta = (r, i) => `<div class="card hv ${r.Semaforo}" style="animation-delay:${Math.min(i, 12) * 40}ms${r.Estado === "Anulado" ? ";filter:grayscale(1) opacity(.6)" : ""}" onclick="ver('${esc(r.ID_Registro)}')"><b>${esc(r.Cite)}</b>
  <div class="mu" style="margin:6px 0">${esc(r.Asunto)}</div><span class="pill">${esc(r.Estado)}</span><span class="pill">${esc(r.Destino)}</span></div>`;
const buscar = run(async () => { const q = $("bq").value.trim(), f = { Estado: vista === "inicio" ? "" : $("be").value };
  const j = await api({ op: "buscar", filtros: q ? Object.assign(f, /^REG-/i.test(q) ? { ID_Registro: q } : { Cite: q }) : f });
  if (vista === "inicio") { const c = e => j.registros.filter(r => r.Estado === e).length;
    $("v-inicio").innerHTML = `<div class="hero"><h1>Bienvenido, ${esc(cat.usuario.nombre)}</h1><p>${esc(cat.marca.nombre)} · Gestión ${cat.gestion}</p></div>
    <div class="grid" style="margin-bottom:22px">${[["En revisión", c("En revisión")], ["Pendiente de despacho", c("Pendiente de despacho")], ["Despachados", c("Despachado")], ["Total (últimos 200)", j.total]].map(x => `<div class="card"><div class="stat">${x[1]}</div><div class="mu">${x[0]}</div></div>`).join("")}</div>
    <h3>Recientes</h3><div class="grid">${j.registros.slice(0, 8).map(tarjeta).join("") || '<p class="mu">Sin registros.</p>'}</div>`;
  } else $("lista").innerHTML = j.registros.map(tarjeta).join("") || '<p class="mu">Sin resultados. Modifique los criterios de búsqueda.</p>'; });
const alta = run(async () => { const j = await api({ op: "alta", gestion: cat.gestion, tipo: $("at").value, dependencia: $("ad").value, unidad: $("au").value, jefatura: $("aj").value,
  destino: $("ade").value, responsable: $("ar").value, destinatario: $("adt").value, asunto: $("aa").value, referencia: $("arf").value });
  const v = $("vc"); v.style.display = "block"; v.innerHTML = `<div class="mu">Cite asignado</div><div class="stat">${esc(j.cite)}</div><div class="mu">Solicitado por ${esc(cat.usuario.nombre)} · ${esc(new Date().toLocaleString())}</div>`;
  msg("Cite asignado: " + j.cite, true); ["ar", "adt", "aa", "arf"].forEach(i => $(i).value = ""); });
let cur = null;
const ver = run(async id => { const j = await api({ op: "obtener", id }), r = cur = j.registro, an = r.Estado === "Anulado", sig = cat.transiciones[r.Estado] || [], d = $("det");
  d.innerHTML = `<h3>${esc(r.Cite)} ${an ? '<span class="pill" style="background:#7f1d1d">ANULADO</span>' : ""}</h3>
  <p>${esc(r.ID_Registro)} · ${esc(r.Asunto)}<br>Estado: <b>${esc(r.Estado)}</b> · ${esc(r.Destino)}${r.Instancia_Actual ? " · instancia actual: <b>" + esc(r.Instancia_Actual) + "</b> (paso " + esc(r.Paso) + ")" : ""}${r.Semaforo ? " · " + esc(r.Semaforo) + " (" + esc(r.Tiempo_Transcurrido) + ")" : ""}<br>
  Solicitado por ${esc(r.Solicitado_Por || "—")} el ${esc(r.Fecha_Registro)} ${esc(r.Hora_Registro)} desde ${esc(r.Dependencia)} / ${esc(r.Unidad)}<br>
  ${an ? `Anulado por ${esc(r.Anulado_Por)} el ${esc(r.Fecha_Anulacion)}. Motivo: ${esc(r.Motivo_Anulacion)}<br>` : ""}<span class="mu">El PDF y el archivo se gestionan en el módulo Archivo.</span></p>
  ${!an && has("estado") && cat.modulos.estados && sig.length ? `<label>Nuevo estado</label><select id="ne">${opts(sig)}</select><label>Observaciones / motivo</label><input id="no"><button class="btn" onclick="estado('${esc(id)}')">Cambiar estado</button>` : ""}

  ${!an && has("editar") && cat.modulos.editar ? `<button class="btn s" onclick="formEd()">Editar datos</button>` : ""}${!an && has("anular") && cat.modulos.anular ? `<button class="btn s" onclick="anular('${esc(id)}')">Anular cite</button>` : ""}
  <div id="ed"></div>
  ${derivBloque(id, j.derivaciones || [], an)}
  ${j.historial ? "<h4>Historial</h4>" + j.historial.map(h => `<div class="mu">${esc(h.Fecha)} ${esc(h.Hora)} · ${esc(h.Usuario)} · ${esc(h.Estado_Anterior)} → ${esc(h.Estado_Nuevo)}${h.Observaciones ? " · " + esc(h.Observaciones) : ""}</div>`).join("") : ""}`;
  d.classList.remove("h"); d.scrollIntoView(); });
const ED = ["Destinatario", "Asunto", "Referencia", "Responsable", "Remitente", "Observaciones"];
function formEd() { $("ed").innerHTML = `<h4>Editar datos (el número de cite no se modifica)</h4><div class="g">${ED.map((k, i) => `<div><label>${k}</label><input id="ef${i}" value="${esc(cur[k])}"></div>`).join("")}</div><button class="btn" onclick="gEd()">Guardar cambios</button>`; }
const gEd = run(async () => { const d = {}; ED.forEach((k, i) => d[k] = $("ef" + i).value); await api({ op: "editar", id: cur.ID_Registro, datos: d }); msg("Cambios guardados.", true); ver(cur.ID_Registro); buscar(); });
const anular = run(async id => { const m = prompt("Motivo de la anulación (obligatorio, mínimo 10 caracteres).\nEl número de cite NO se elimina: queda registrado como anulado."); if (!m) return;
  await api({ op: "anular", id, motivo: m }); msg("Cite anulado.", true); ver(id); buscar(); });
const estado = run(async id => { await api({ op: "cambiarEstado", id, estado: $("ne").value, obs: $("no").value }); msg("Estado actualizado.", true); ver(id); buscar(); });


/* ---------- Correspondencia recibida y derivaciones ---------- */
const hoyISO = () => new Date().toISOString().slice(0, 10);
function formRec() { const f = $("rform"); if (!has("recibir")) { f.classList.add("h"); return; } f.classList.remove("h");
  f.innerHTML = `<h3>Registrar correspondencia recibida</h3><div class="g"><div><label>Dependencia receptora</label><select id="rd" onchange="rUni()">${opts(cat.dependencias, "Sigla", x => x.Sigla)}</select></div><div><label>Unidad receptora</label><select id="ru"></select></div>
  <div><label>Remitente</label><input id="rr"></div><div><label>Institución de origen</label><input id="ri"></div><div><label>Número / cite del documento</label><input id="rc"></div><div><label>Fecha del documento</label><input id="rf" type="date"></div>
  <div><label>Tipo documental (opcional)</label><select id="rt"><option value="">—</option>${opts(cat.tipos, "Codigo", x => x.Codigo + " — " + x.Tipo)}</select></div></div>
  <label>Asunto</label><input id="ra"><label>Referencia</label><input id="rrf"><button class="btn" onclick="altaRec()">Registrar recepción</button>`; rUni(); }
function rUni() { $("ru").innerHTML = opts(cat.unidades.filter(u => u.Dependencia === $("rd").value), "Sigla", x => x.Sigla); }
const altaRec = run(async () => { const j = await api({ op: "altaRecibida", dependencia: $("rd").value, unidad: $("ru").value, remitente: $("rr").value, institucion: $("ri").value, citeExterno: $("rc").value, fechaDocumento: $("rf").value, tipo: $("rt").value, asunto: $("ra").value, referencia: $("rrf").value });
  msg("Documento registrado: " + j.id, true); ["rr", "ri", "rc", "rf", "ra", "rrf"].forEach(i => $(i).value = ""); buscarRec(); verRec(j.id); });
const tarjetaRec = (r, i) => `<div class="card hv" style="animation-delay:${Math.min(i, 12) * 40}ms" onclick="verRec('${esc(r.ID_Recibido)}')"><b>${esc(r.Cite_Externo || r.ID_Recibido)}</b><div class="mu" style="margin:6px 0">${esc(r.Remitente)} — ${esc(r.Asunto)}</div><span class="pill">${esc(r.Estado)}</span><span class="pill">${esc(r.Dependencia)}/${esc(r.Unidad)}</span></div>`;
const buscarRec = run(async () => { const q = $("rq").value.trim(), f = { Estado: $("re").value };
  if (q) { if (/^REC-/i.test(q)) f.ID_Recibido = q; else f.Remitente = q; }
  const j = await api({ op: "buscarRecibidos", filtros: f }); $("rlista").innerHTML = j.registros.map(tarjetaRec).join("") || '<p class="mu">Sin documentos recibidos.</p>'; });
const verRec = run(async id => { const j = await api({ op: "obtenerRecibido", id }), r = j.registro, d = $("rdet");
  d.innerHTML = `<h3>${esc(r.Cite_Externo || r.ID_Recibido)} <span class="pill">${esc(r.Estado)}</span></h3><p>${esc(r.ID_Recibido)} · ${esc(r.Asunto)}<br>De: <b>${esc(r.Remitente)}</b>${r.Institucion_Origen ? " (" + esc(r.Institucion_Origen) + ")" : ""}${r.Fecha_Documento ? " · documento del " + esc(r.Fecha_Documento) : ""}<br>Recibido el ${esc(r.Fecha_Registro)} ${esc(r.Hora_Registro)} en ${esc(r.Dependencia)}/${esc(r.Unidad)} · ${esc(r.Registrado_Por)}<br><span class="mu">El archivo físico y digital se gestiona en el módulo Archivo.</span></p>${derivBloque(id, j.derivaciones || [], r.Estado === "Anulado")}`;
  d.classList.remove("h"); d.scrollIntoView(); });
function derivBloque(id, ders, bloqueado) {
  const abierta = ders.some(x => ["Pendiente", "Recibida"].includes(x.Estado));
  const tabla = ders.length ? `<table class="tb"><tr><th>Ruta</th><th>Detalle</th><th>Estado</th><th></th></tr>${ders.map(x => derFila(x, id)).join("")}</table>` : '<p class="mu">Sin derivaciones.</p>';
  const form = has("derivar") && !bloqueado && !abierta ? `<h4>Derivar</h4><div class="g"><div><label>Dependencia</label><select id="vd_${esc(id)}" onchange="vUni('${esc(id)}')">${opts(cat.dependencias, "Sigla", x => x.Sigla)}</select></div><div><label>Unidad</label><select id="vu_${esc(id)}"></select></div><div><label>Fecha límite</label><input type="date" id="vl_${esc(id)}"></div></div><label>Instrucciones</label><input id="vi_${esc(id)}"><button class="btn" onclick="derivar('${esc(id)}')">Derivar</button>` : "";
  setTimeout(() => vUni(id), 0);
  return `<h4>Derivaciones y seguimiento</h4>${tabla}${form}`; }
function vUni(id) { const d = $("vd_" + id), u = $("vu_" + id); if (d && u) u.innerHTML = opts(cat.unidades.filter(x => x.Dependencia === d.value), "Sigla", x => x.Sigla); }
function derFila(x, ctx) { const ab = ["Pendiente", "Recibida"].includes(x.Estado), pm = has("derivar");
  return `<tr><td>${esc(x.Dep_Origen)}/${esc(x.Uni_Origen)} → <b>${esc(x.Dep_Destino)}/${esc(x.Uni_Destino)}</b></td><td class="mu">${esc(x.Fecha_Derivacion)}${x.Fecha_Limite ? " · límite " + esc(x.Fecha_Limite) : ""}${x.Instrucciones ? "<br>" + esc(x.Instrucciones) : ""}${x.Respuesta ? "<br>Respuesta: " + esc(x.Respuesta) : ""}${x.ID_Registro_Respuesta ? " (cite " + esc(x.ID_Registro_Respuesta) + ")" : ""}</td>
  <td><span class="pill">${esc(x.Estado)}</span>${x._vencida ? ' <span class="pill" style="background:#7f1d1d">Vencida</span>' : ""}</td><td>${pm && x.Estado === "Pendiente" ? `<button class="btn s" onclick="derAcc('rec','${esc(x.ID_Derivacion)}','${esc(ctx)}')">Recibir</button>` : ""}${pm && ab ? `<button class="btn s" onclick="derAcc('resp','${esc(x.ID_Derivacion)}','${esc(ctx)}')">Responder</button>` : ""}${pm && !["Cerrada", "Anulada"].includes(x.Estado) ? `<button class="btn s" onclick="derAcc('cer','${esc(x.ID_Derivacion)}','${esc(ctx)}')">Cerrar</button><button class="btn s" onclick="derAcc('anu','${esc(x.ID_Derivacion)}','${esc(ctx)}')">Anular</button>` : ""}</td></tr>`; }
const derivar = run(async id => { await api({ op: "derivar", id, dependencia: $("vd_" + id).value, unidad: $("vu_" + id).value, fechaLimite: $("vl_" + id).value, instrucciones: $("vi_" + id).value }); msg("Documento derivado.", true); refrescarDoc(id); });
const refrescarDoc = id => { if (/^REC-/.test(id)) { verRec(id); buscarRec(); } else { ver(id); } if (vista === "derivaciones") listarDer(); };
const derAcc = run(async (a, did, ctx) => {
  if (a === "rec") await api({ op: "derivacionRecibir", id: did });
  else if (a === "resp") { const r = prompt("Respuesta:"); if (!r) return; const c = prompt("ID del cite emitido como respuesta (opcional, p. ej. REG-2026-00012):") || ""; await api({ op: "derivacionResponder", id: did, respuesta: r, idRegistroRespuesta: c.trim() }); }
  else if (a === "cer") { const o = prompt("Observaciones (opcional):"); if (o === null) return; await api({ op: "derivacionCerrar", id: did, observaciones: o }); }
  else { const o = prompt("Motivo de la anulación (obligatorio):"); if (!o) return; await api({ op: "derivacionCerrar", id: did, anular: true, observaciones: o }); }
  msg("Derivación actualizada.", true); refrescarDoc(ctx); });
const listarDer = run(async () => { const f = { estado: $("de").value, sentido: $("ds").value, soloAbiertas: $("dab").checked };
  const j = await api({ op: "listarDerivaciones", filtros: f });
  $("dlista").innerHTML = j.derivaciones.length ? `<table class="tb"><tr><th>Documento</th><th>Ruta</th><th>Detalle</th><th>Estado</th><th></th></tr>${j.derivaciones.map(x => derFila(x, x.ID_Registro).replace("<tr><td>", `<tr><td><a href="#" onclick="abrirDoc('${esc(x.ID_Registro)}');return false">${esc(x._cite || x.ID_Registro)}</a><br><span class="mu">${esc(x._asunto)}</span></td><td>`)).join("")}</table>` : '<p class="mu">Sin derivaciones con esos criterios.</p>'; });
function abrirDoc(id) { if (/^REC-/.test(id)) { ir("recibidos"); verRec(id); } else { ir("registros"); ver(id); } }

/* ---------- Administración ---------- */
const AT = [["modulos", "Módulos y cites"], ["catalogos", "Catálogos"], ["flujos", "Flujos"], ["roles", "Roles y permisos"], ["usuarios", "Usuarios"]];
const adminTab = run(async t => { ss.set("at", t);
  $("atabs").innerHTML = AT.map(x => `<button class="${x[0] === t ? "on" : ""}" onclick="adminTab('${x[0]}')">${x[1]}</button>`).join("");
  ad = await api({ op: "adminDatos" }); const c = ad.config, A = $("adm");
  if (t === "modulos") A.innerHTML = `<div class="p"><div class="mu" style="margin-bottom:10px">Nombre, logo y colores de la institución se gestionan en la Suite (Configuración de la empresa). Aquí solo se define la sigla de la instancia para el cite y la gestión.</div><label>Sigla de la instancia (usada en el cite)</label><input id="ci" value="${esc(c.InstanciaPrincipal)}"><label>Gestión actual</label><input id="cg" value="${esc(c.GestionActual)}"><h3>Módulos</h3>${[["alta", "Registro de documentos"], ["estados", "Cambio de estados"], ["pdf", "Archivo digital (PDF)"], ["busqueda", "Búsqueda"], ["anular", "Anulación de cites"], ["editar", "Edición de datos del documento"]].map(m =>
    `<label style="display:flex;gap:10px;align-items:center;text-transform:none;font-size:15px;color:var(--tx)"><input type="checkbox" id="m_${m[0]}" ${c["Modulo_" + m[0]] !== "NO" ? "checked" : ""}> ${m[1]}</label>`).join("<br>")}
    <p class="mu">Deshabilitar un módulo no borra datos.</p></div>
    <div class="p"><h3>Numeración de cites</h3><p class="mu">La estructura del cite es única para toda la institución y se define en la Suite: Administración → Cites. Cada unidad numera desde 1 y el correlativo se reinicia cada gestión. Si la unidad ya tenía cites numerados en Archivo, el administrador confirma allí desde qué número continuar antes de emitir aquí.</p></div>
    <div class="p"><button class="btn" onclick="gMod()">Guardar</button></div>`;
  if (t === "catalogos") { const hj = ss.get("ch") || "Dependencias", F = ESQ[hj], L = ad.cat[hj] || [];
    A.innerHTML = `<div class="p"><h3>Catálogos</h3><label>Catálogo</label><select onchange="ss.set('ch',this.value);adminTab('catalogos')">${Object.keys(ESQ).map(k => `<option ${k === hj ? "selected" : ""}>${k}</option>`).join("")}</select>
    <p class="mu">Las siglas (hasta 12 caracteres) forman el cite. Desactivar no borra los registros históricos. Si falta la hoja o la columna Activo, el sistema lo indicará.</p>
    <div class="grid">${L.map((x, i) => `<div class="card"><b>${esc(F.map(k => x[k]).slice(0, 2).join(" · "))}</b><div class="mu">${esc(F.slice(2).map(k => x[k]).join(" · "))} · ${x.Activo === "NO" ? "Inactivo" : "Activo"}</div>
      <button class="btn s sm" onclick="edItem(${i})">Editar</button><button class="btn s sm" onclick="actItem(${i},${x.Activo === "NO"})">${x.Activo === "NO" ? "Activar" : "Desactivar"}</button></div>`).join("") || '<p class="mu">Sin elementos.</p>'}</div>
    <h4>Agregar o editar</h4><div class="g">${F.map((k, i) => k === "Flujo" ? `<div><label>¿Pasa por flujo de firma y visto bueno?</label><select id="cf${i}"><option>SI</option><option>NO</option></select></div>` : `<div><label>${k}</label><input id="cf${i}"></div>`).join("")}</div><button class="btn" onclick="gItem()">Guardar</button></div>`; }
  if (t === "flujos") { const ts = (ad.cat.TiposDocumentales || []).filter(x => x.Activo !== "NO" && x.Flujo !== "NO"), ft = ss.get("ft") || (ts[0] || {}).Codigo || "";
    A.innerHTML = `<div class="p"><h3>Flujo de firma y visto bueno</h3><p class="mu">Solo los tipos marcados con flujo aparecen aquí. Los demás tipos reciben cite y se archivan. Cada paso lo atiende la dependencia indicada. Al aprobar el último paso el documento queda pendiente de despacho.</p>
    <label>Tipo documental</label><select onchange="ss.set('ft',this.value);adminTab('flujos')">${ts.map(x => `<option value="${esc(x.Codigo)}" ${x.Codigo === ft ? "selected" : ""}>${esc(x.Codigo + " — " + x.Tipo)}</option>`).join("")}</select>
    <div id="fl"></div><button class="btn s" onclick="flAdd()">+ Agregar paso</button><button class="btn" onclick="gFlujo()">Guardar flujo</button><p class="mu">Los documentos ya en curso conservan la instancia que tienen asignada; el cambio rige para los pasos siguientes y los documentos nuevos.</p></div>`;
    FL = ad.flujos.filter(f => f.Tipo === ft && f.Activo !== "NO").sort((x, y) => x.Orden - y.Orden).map(f => ({ etapa: f.Etapa, instancia: f.Instancia })); flDraw(); }
  if (t === "roles") { const rs = ad.roles, pm = r => ad.permisos.find(x => x.Rol === r) || {};
    A.innerHTML = `<div class="p"><h3>Roles y permisos</h3><p class="mu">Marque las funciones de cada rol. Cada usuario recibe un único rol; los permisos se validan en el servidor en cada operación. Un módulo deshabilitado en "Módulos y cites" anula la función para todos.</p>
    <div style="overflow-x:auto"><table><tr><th>Función</th>${rs.map((r, j) => `<th><b>${esc(r.Rol)}</b>${r.Activo !== "SI" ? '<div class="mu">inactivo</div>' : ""}<div class="mu">${esc(r.Descripcion || "")}</div>
      <div style="margin-top:6px"><button class="btn s sm" title="Marcar o desmarcar todo" onclick="tgRol(${j})">☑</button><button class="btn s sm" title="Renombrar o describir" onclick="rnRol(${j})">✎</button><button class="btn s sm" title="${r.Activo === "SI" ? "Desactivar" : "Activar"}" onclick="gRol(${j})">${r.Activo === "SI" ? "⏸" : "▶"}</button><button class="btn s sm" title="Eliminar" onclick="delRol(${j})">🗑</button></div></th>`).join("")}</tr>
    ${GRP.map(g => `<tr><td colspan="${rs.length + 1}" class="mu" style="text-align:left;background:#ffffff08">${g[0]}</td></tr>` + g[1].map(k => `<tr><td>${ETQ[k]}</td>${rs.map((r, j) => `<td><input type="checkbox" class="pk" data-j="${j}" data-k="${k}" ${pm(r.Rol)[k] === "SI" ? "checked" : ""}></td>`).join("")}</tr>`).join("")).join("")}</table></div>
    <button class="btn" onclick="gMatriz()">Guardar permisos</button></div>
    <div class="p"><h4>Nuevo rol</h4><div class="g"><div><label>Nombre</label><input id="rn"></div><div><label>Descripción</label><input id="rd"></div><div><label>Copiar permisos de</label><select id="rc"><option value="">(ninguno)</option>${rs.map(r => `<option>${esc(r.Rol)}</option>`).join("")}</select></div></div><button class="btn" onclick="nRol()">Crear rol</button></div>`; }
  if (t === "usuarios") { const j = await api({ op: "listarUsuarios" }), act = ad.roles.filter(r => r.Activo === "SI");
    A.innerHTML = `<div class="p"><h3>Perfiles de usuarios</h3><p class="mu">Las personas y sus contraseñas se gestionan en la Suite (Configuración → Usuarios). Aquí se define el rol y la dependencia de cada persona dentro de Cites&amp;Firmas.</p><div class="grid">${j.usuarios.map(u => `<div class="card"><b>${esc(u.Nombre_Completo)}</b><div class="mu">${esc(u.Nombre_Usuario)} · ${u.Activo === "SI" ? "Activo" : "Inactivo"}</div>
      <label style="margin-top:10px">Rol</label><select id="ru_${esc(u.ID_Usuario)}" onchange="rolU('${esc(u.ID_Usuario)}',this.value)">${act.map(r => `<option ${r.Rol === u.Rol ? "selected" : ""}>${esc(r.Rol)}</option>`).join("")}</select>
      <label>Dependencia</label><select id="du_${esc(u.ID_Usuario)}" onchange="depU('${esc(u.ID_Usuario)}',this.value)"><option value="">(sin dependencia)</option>${cat.dependencias.map(d => `<option ${d.Sigla === u.Dependencia ? "selected" : ""}>${esc(d.Sigla)}</option>`).join("")}</select></div>`).join("") || '<p class="mu">Sin usuarios habilitados para este módulo.</p>'}</div></div>`; } });
const ESQ = { Dependencias: ["Sigla", "Denominación"], Unidades: ["Sigla", "Denominación", "Dependencia"], Jefaturas: ["Sigla", "Denominación", "Unidad", "Dependencia"], TiposDocumentales: ["Codigo", "Tipo", "Naturaleza", "Uso", "Hoja", "Flujo"] };
const hoja = () => ss.get("ch") || "Dependencias";
function edItem(i) { ESQ[hoja()].forEach((k, j) => $("cf" + j).value = ad.cat[hoja()][i][k] || ""); }
const gItem = run(async () => { const d = {}; ESQ[hoja()].forEach((k, j) => d[k] = $("cf" + j).value.trim()); await api({ op: "guardarItem", hoja: hoja(), datos: d }); msg("Guardado.", true); adminTab("catalogos"); });
const actItem = run(async (i, activo) => { const d = {}, x = ad.cat[hoja()][i]; ESQ[hoja()].forEach(k => d[k] = x[k]); await api({ op: "guardarItem", hoja: hoja(), datos: d, activo }); adminTab("catalogos"); });
let FL = [];
const flDraw = () => $("fl").innerHTML = FL.map((x, i) => `<div class="card" style="padding:10px 12px;margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${i + 1}</b>
  <select style="width:auto;margin:0" onchange="FL[${i}].etapa=this.value"><option ${x.etapa === "Visto Bueno" ? "selected" : ""}>Visto Bueno</option><option ${x.etapa === "Firma" ? "selected" : ""}>Firma</option></select>
  <select style="width:auto;margin:0" onchange="FL[${i}].instancia=this.value">${cat.dependencias.map(d => `<option ${d.Sigla === x.instancia ? "selected" : ""}>${esc(d.Sigla)}</option>`).join("")}</select>
  <button class="btn s sm" onclick="flMv(${i},-1)">↑</button><button class="btn s sm" onclick="flMv(${i},1)">↓</button><button class="btn s sm" onclick="FL.splice(${i},1);flDraw()">Quitar</button></div>`).join("") || '<p class="mu">Sin pasos: los documentos de este tipo elegirán el destino al solicitar el cite.</p>';
function flAdd() { FL.push({ etapa: "Visto Bueno", instancia: cat.dependencias[0].Sigla }); flDraw(); }
function flMv(i, d) { const j = i + d; if (j < 0 || j >= FL.length) return; [FL[i], FL[j]] = [FL[j], FL[i]]; flDraw(); }
const gFlujo = run(async () => { if (!FL.length) return msg("Agregue al menos un paso."); await api({ op: "guardarFlujo", tipo: ss.get("ft") || ad.cat.TiposDocumentales.find(x => x.Flujo !== "NO").Codigo, pasos: FL }); msg("Flujo guardado.", true); cat = await api({ op: "catalogos" }); adminTab("flujos"); });
const gCfg = run(async c => { await api({ op: "guardarConfig", cambios: c }); msg("Guardado.", true); cat = await api({ op: "catalogos" }); marca(cat.marca); });
const gMod = () => gCfg({ Modulo_alta: m_alta.checked ? "SI" : "NO", Modulo_estados: m_estados.checked ? "SI" : "NO", Modulo_pdf: m_pdf.checked ? "SI" : "NO", Modulo_busqueda: m_busqueda.checked ? "SI" : "NO", Modulo_anular: m_anular.checked ? "SI" : "NO", Modulo_editar: m_editar.checked ? "SI" : "NO",
  InstanciaPrincipal: ci.value, GestionActual: cg.value }).then(() => iniciar());
const GRP = [["Consulta", ["consultar", "historial"]], ["Registro de documentos", ["alta", "editar", "anular"]], ["Flujo y archivo", ["estado", "pdf"]], ["Administración", ["usuarios", "admin"]]];
function tgRol(j) { const bs = [...document.querySelectorAll('.pk[data-j="' + j + '"]')], todo = bs.every(b => b.checked); bs.forEach(b => b.checked = !todo); }
const gMatriz = run(async () => { const por = {}; document.querySelectorAll(".pk").forEach(b => { por[b.dataset.j] = por[b.dataset.j] || {}; por[b.dataset.j][b.dataset.k] = b.checked; });
  try { for (const j of Object.keys(por)) { const r = ad.roles[j].Rol, p = ad.permisos.find(x => x.Rol === r) || {};
      if (ad.lista.some(k => (p[k] === "SI") !== !!por[j][k])) await api({ op: "guardarPermisos", rol: r, permisos: por[j] }); }
    msg("Permisos guardados.", true); cat = await api({ op: "catalogos" }); } finally { adminTab("roles"); } });
const rnRol = run(async j => { const r = ad.roles[j], n = prompt("Nombre del rol:", r.Rol); if (!n) return; const d = prompt("Descripción:", r.Descripcion || "");
  await api({ op: "renombrarRol", rol: r.Rol, nuevo: n, descripcion: d || "" }); msg("Rol actualizado.", true); adminTab("roles"); });
const gRol = run(async j => { const r = ad.roles[j]; await api({ op: "estadoRol", rol: r.Rol, activo: r.Activo !== "SI" }); adminTab("roles"); });
const delRol = run(async j => { const r = ad.roles[j]; if (!confirm("¿Eliminar el rol \"" + r.Rol + "\"? Solo es posible si ningún usuario lo tiene. Esta acción no se puede deshacer.")) return;
  await api({ op: "eliminarRol", rol: r.Rol }); msg("Rol eliminado.", true); adminTab("roles"); });
const nRol = run(async () => { await api({ op: "crearRol", rol: rn.value, descripcion: rd.value, copiarDe: rc.value }); msg("Rol creado. Revise sus permisos en la matriz.", true); adminTab("roles"); });
const rolU = run(async (id, rol) => { await api({ op: "cambiarRolUsuario", id, rol }); msg("Rol actualizado.", true); });
const depU = run(async (id, dependencia) => { await api({ op: "guardarPerfil", id, dependencia }); msg("Dependencia actualizada.", true); });
JDI.ready.then(() => { JDI.onBrand(() => { marca(null); }); iniciar(); });
</script></body></html>
