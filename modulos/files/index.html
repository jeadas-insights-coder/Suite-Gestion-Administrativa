<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JeaDas.Insights - Identificadores</title>
<style>
:root{
  color-scheme:dark;
  --jdi-primary:#214EC2;--jdi-secondary:#8A3DA6;--jdi-on-primary:#FFFFFF;--jdi-primary-hover:#1E46AF;--jdi-primary-focus:rgba(55,96,200,.45);
  --bg:#13235A;--surface:#1A2D6E;--surface-soft:#1D3278;--surface-2:#22398A;
  --ink:#F4F7FF;--muted:#B4C0E6;--line:#2E4796;--accent:var(--jdi-primary);
  --success:#22c55e;--danger:#ef4444;
  --shadow:0 8px 26px rgba(0,0,0,.35);--shadow-hover:0 18px 40px rgba(0,0,0,.5);
  --radius:14px;--ease:cubic-bezier(.2,.75,.25,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);
  font:14.5px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
header{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;
  padding:16px clamp(14px,3vw,36px);background:linear-gradient(180deg,#1A2D6E,#101E50);border-bottom:1px solid var(--line)}
header h1{font-size:clamp(17px,2vw,22px);margin:0;font-weight:750;letter-spacing:-.02em}
header h1 span{color:var(--accent)}
header p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
#sessionInfo{font-size:12px;color:var(--muted);text-align:right;overflow-wrap:anywhere}
main{width:min(1240px,100%);margin:clamp(14px,2.5vw,28px) auto;padding:0 clamp(12px,2.5vw,28px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:clamp(16px,2.2vw,24px);margin-bottom:16px;box-shadow:var(--shadow)}
h1,h2,h3,p{overflow-wrap:anywhere}
h2{font-size:clamp(17px,2vw,21px);line-height:1.3;margin:0 0 14px;letter-spacing:-.02em}
h3{font-size:15px;margin:10px 0}
p{margin-top:0}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;color:#C3CDEE;margin-bottom:6px}
input,select,textarea{display:block;width:100%;min-width:0;min-height:44px;padding:10px 12px;color:var(--ink);
  background:var(--surface-soft);border:1px solid #3A55AA;border-radius:9px;outline:none;transition:border-color .2s,box-shadow .2s}
select option{background:#1D3278;color:var(--ink)}
textarea{min-height:100px;resize:vertical}
input::placeholder,textarea::placeholder{color:#6b6b75}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
input:disabled,select:disabled{opacity:.55;cursor:not-allowed}
input[type=date]{color-scheme:dark}
.field{min-width:0;margin-bottom:13px}
.grid,.grid3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn,.tab{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:42px;border:1px solid transparent;
  border-radius:9px;padding:10px 15px;cursor:pointer;font-weight:650;font-size:13px;text-decoration:none;
  transition:transform .2s var(--ease),background .2s,border-color .2s,box-shadow .2s,filter .2s}
.btn{color:var(--jdi-on-primary,#fff);background:var(--jdi-primary);box-shadow:0 5px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:active,.tab:active{transform:translateY(0) scale(.985)}
.btn:focus-visible,.tab:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.secondary,.tab{color:#d4d4d8;background:var(--surface-2);border-color:#3A55AA;box-shadow:none;background-image:none}
.secondary:hover,.tab:hover{background:#2A44A0;border-color:#44444e;filter:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px;padding:4px 0}
.tab{white-space:nowrap}
.tab.active{background:var(--accent);border-color:var(--accent);color:var(--jdi-on-primary,#fff);box-shadow:0 5px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.row>*{min-width:0}
.muted{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.msg{margin:12px 0 0;padding:11px 13px;border:1px solid #1e3a5f;border-radius:10px;background:#0f1e33;color:#9cc4f5;overflow-wrap:anywhere}
.error{background:#2a1214;border-color:#5c1f24;color:#fca5a5}
.success{background:#0f2a1a;border-color:#1d5a35;color:#86efac}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
td,th{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:11px 10px}
th{position:sticky;top:0;background:#1E3580;color:#b4b4be;font-size:11px;letter-spacing:.055em;text-transform:uppercase;white-space:nowrap}
tbody tr:hover{background:#1D3278}
td{overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;background:#1f2937;color:#cbd5e1;border:1px solid #334155}
.pill.on{background:#0f2a1a;color:#86efac;border-color:#1d5a35}.pill.off{background:#2a1214;color:#fca5a5;border-color:#5c1f24}
#view-dashboard .grid3>div{min-width:0;padding:17px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(145deg,#1D3278,#1A2D6E);transition:transform .24s var(--ease),border-color .24s}
#view-dashboard .grid3>div h2{font-size:clamp(23px,3vw,32px);color:var(--accent);margin:7px 0 0;font-variant-numeric:tabular-nums}
#view-dashboard .grid3>div h3{margin:7px 0 0}
@media(hover:hover){#view-dashboard .grid3>div:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}}
.preview{width:100%;max-width:800px;margin-inline:auto;padding:clamp(12px,3vw,28px);background:#fff;color:#111;border:1px dashed #a8bac8;border-radius:10px;overflow-wrap:anywhere}
.print-page{min-height:240px;padding:18px;background:#fff;color:#111}
.print-page h1,.print-page h2,.print-page h3{color:#111}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px 14px 28px}
#notice:empty{display:none}
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
@media(max-width:760px){
  .grid,.grid3{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-inline:contain;padding:4px 0 9px;scrollbar-width:thin}
  .tab{flex:0 0 auto}
  #view-history>div[style*="overflow"] table{min-width:760px}
  #view-locations>div[style*="overflow"] table{min-width:520px}
  #view-users>div[style*="overflow"] table{min-width:560px}
}
@media(max-width:520px){
  #sessionInfo{text-align:left}
  .grid,.grid3{grid-template-columns:minmax(0,1fr)}
  .row{align-items:stretch}.row>.btn{width:100%}
  .btn{min-height:44px}
  td,th{padding:9px 8px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media print{
  @page{margin:10mm}
  body{background:#fff!important;color:#000!important;font-size:10pt}
  header,.tabs,.no-print,footer,.btn,#notice{display:none!important}
  main{width:100%;max-width:none;margin:0;padding:0}
  .card{border:0!important;box-shadow:none!important;padding:0!important;margin:0!important;background:#fff!important}
  .print-page{border:0!important;padding:0!important;min-height:0}
  #printPreview{display:block!important;max-width:none!important;border:0!important;padding:0!important}
}
/* tokens: hover 10 % más oscuro (el anillo de enfoque ya usa el acento) */
.btn:not(.secondary):hover{background:var(--jdi-primary-hover,var(--jdi-primary));filter:none}
.btn:focus-visible,.tab:focus-visible{outline-color:var(--jdi-primary-focus,rgba(55,96,200,.45))}
/* celular: sin hover, el feedback es el toque (:active) */
.btn:not(.secondary):active{background:var(--jdi-primary-hover,var(--jdi-primary));transform:scale(.98)}
</style>
<style>
.stat{min-width:0;padding:17px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(145deg,#1D3278,#1A2D6E)}
.stat b{display:block;font-size:clamp(23px,3vw,32px);color:var(--accent);font-variant-numeric:tabular-nums}
.pill.warn{background:#2a2410;color:#fcd34d;border-color:#5c4a1f}
.bar{height:8px;border-radius:99px;background:#0f1a44;overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;background:var(--success)}
.lnk{background:none;border:0;color:var(--jdi-accent-text,#9db4ff);cursor:pointer;padding:0;text-align:left;text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:4vh 12px;z-index:50}
.modal>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;width:min(640px,100%)}
.tablewrap{overflow:auto}
@media(max-width:760px){.tablewrap table{min-width:640px}}
</style>
</head>
<body>
<header><div><h1>JeaDas.Insights <span>·</span> Files de personal</h1><p>Legajo digital, requisitos, vencimientos e historial laboral</p></div><div id="sessionInfo"></div></header>
<main>
<div class="card row"><div><b id="welcome"></b><div id="institutionLabel" class="muted"></div></div></div>
<nav id="tabs" class="tabs no-print"></nav><div id="notice"></div>
<section id="view-panel" class="view card"></section>
<section id="view-personal" class="view card hidden"></section>
<section id="view-file" class="view card hidden"></section>
<section id="view-requisitos" class="view card hidden"></section>
<section id="view-usuarios" class="view card hidden"></section>
<section id="view-roles" class="view card hidden"></section>
<section id="view-auditoria" class="view card hidden"></section>
<div id="modal"></div>
<footer>JeaDas.Insights · Files de personal</footer></main>
<script src="../../assets/suite-bridge.js?v=2.0.0"></script>
<script src="js/files.js?v=2.0.0"></script>
</body></html>
